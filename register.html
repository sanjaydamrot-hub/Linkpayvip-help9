<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LinkPay VIP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page center">
    <section class="card form-card">
      <div class="brand"><div class="logo-mark">VIP</div><div>LinkPay</div></div>
      <h1>Create Account</h1>

      <form id="registerForm">
        <label>User Name</label>
        <input id="username" required placeholder="Enter user name">

        <label>Password</label>
        <input id="password" type="password" required placeholder="Enter password">

        <label>Phone Number</label>
        <div class="phone-row">
          <span class="prefix">+91</span>
          <input id="phone" inputmode="numeric" maxlength="10" required placeholder="10 digit mobile number">
        </div>

        <label>OTP Code</label>
        <div class="otp-row">
          <input id="registerOtp" inputmode="numeric" maxlength="6" required placeholder="6 digit OTP">
          <button type="button" class="send-btn" id="registerSend">Send</button>
        </div>
        <small id="registerTimer"></small>

        <label>Invite Code</label>
        <input id="invite" placeholder="Enter invite code">

        <button class="btn full" type="submit">Register</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
